spring:
  application:
    name: ridehailing-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ridehailing}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 60000

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: ridehailing-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  websocket:
    allowed-origins: "*"

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

  paystack:
    secret-key: ${PAYSTACK_SECRET_KEY:your-paystack-secret-key}
    base-url: ${PAYSTACK_BASE_URL:https://api.paystack.co}

  termii:
    api-key: ${TERMII_API_KEY:your-termii-api-key}
    base-url: ${TERMII_BASE_URL:https://api.ng.termii.com}
    sender-id: ${TERMII_SENDER_ID:RideHailing}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: 8080